[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amp-mc"
version = "1.0.0"
description = "Agentic Minecraft player for supported Java Edition servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Shahyar Anfaz"},
  {name = "Averi Wylie"},
]
dependencies = [
  "anthropic>=0.121,<1",
  "cryptography>=45,<51",
  "python-dotenv>=1,<2",
]

[project.urls]
Homepage = "https://github.com/AveriWylie/AMP"
Issues = "https://github.com/AveriWylie/AMP/issues"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=9.0.3,<10",
]

[project.scripts]
amp = "amp.cli:main"
amp-world = "amp.local_world:main"

[tool.setuptools]
packages = ["amp", "amp.blocks", "amp.entities", "amp.items", "amp.protocol"]

[tool.setuptools.package-data]
"amp.blocks" = ["*.json"]
"amp.entities" = ["*.json"]
"amp.items" = ["*.json"]
"amp.protocol" = ["*.json"]
