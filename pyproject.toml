[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amp-mc"
version = "1.0.0"
description = "Agentic Minecraft player for supported Java Edition servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["minecraft", "bot", "agent", "protocol", "java-edition"]
authors = [
  {name = "Shahyar Anfaz"},
  {name = "Averi Wylie"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "anthropic>=0.121,<1",
  "cryptography>=45,<51",
  "python-dotenv>=1,<2",
]

[project.urls]
Homepage = "https://github.com/AveriWylie/AMP"
Issues = "https://github.com/AveriWylie/AMP/issues"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=9.0.3,<10",
]

[project.scripts]
amp = "amp.cli:main"
amp-world = "amp.local_world:main"

[tool.setuptools.packages.find]
include = ["amp*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
