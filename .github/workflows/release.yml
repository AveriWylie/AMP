name: Release AMP

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("release tag does not match project version")
          PY
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Install AMP package
        run: python -m pip install --no-deps .
      - name: Run offline tests
        run: python -m pytest
      - name: Build distributions
        run: python -m build --no-isolation
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    needs: [build, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions
          path: dist
      - name: Prepare release notes from the changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          with Path("pyproject.toml").open("rb") as source:
              project = tomllib.load(source)["project"]
          changelog = Path("docs/CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## {re.escape(version)} - (?!Unreleased\s*$).+$",
              re.MULTILINE,
          ).search(changelog)
          if heading is None:
              raise SystemExit(
                  f"docs/CHANGELOG.md has no dated section for {version}"
              )
          next_heading = re.compile(r"^## ", re.MULTILINE).search(
              changelog, heading.end()
          )
          end = next_heading.start() if next_heading else len(changelog)
          notes = changelog[heading.end():end].strip()
          if not notes:
              raise SystemExit(f"changelog section for {version} is empty")
          author_names = [author["name"] for author in project["authors"]]
          if len(author_names) == 1:
              authors = author_names[0]
          else:
              authors = ", ".join(author_names[:-1]) + f" and {author_names[-1]}"
          source_url = (
              f'{project["urls"]["Homepage"]}/tree/{os.environ["RELEASE_TAG"]}'
          )
          body = (
              f'- **Authors:** {authors}\n'
              f'- **License:** {project["license"]}\n'
              f'- **Source:** {source_url}\n\n'
              f'## Release highlights\n\n{notes}\n'
          )
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(
              body, encoding="utf-8"
          )
          PY
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: AMP ${{ github.ref_name }} - Agentic Minecraft Player
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/amp-mc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
