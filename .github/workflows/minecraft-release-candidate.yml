name: Minecraft release candidate

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: minecraft-release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Install AMP package
        run: python -m pip install --no-deps .
      - name: Discover stable Minecraft releases
        run: python tools/discover_minecraft_releases.py
      - name: Validate the candidate record
        run: |
          python -m pytest
          python tools/check_version_data.py
      - name: Detect candidate changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- \
            amp/protocol/minecraft_release_candidates.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push candidate branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: automation/minecraft-release-candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add amp/protocol/minecraft_release_candidates.json
          git commit -m "Track Minecraft release candidates"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git push --force-with-lease origin "$BRANCH"
      - name: Open or update candidate pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/minecraft-release-candidates
        shell: bash
        run: |
          body=$(cat <<'EOF'
          This automated PR records stable Minecraft releases not yet tracked by
          AMP. It does not mark them supported or publish an AMP release.

          GitHub does not start workflow runs for commits pushed by
          `github-actions[bot]`, so this PR shows no checks. The offline suite
          and `tools/check_version_data.py` already ran against this content in
          the job that opened the PR. To see the full matrix here, start CI
          manually from the Actions tab and select this branch.

          Before promotion:

          - [ ] Generate protocol, block, item, and entity data.
          - [ ] Review protocol-family and fixture differences.
          - [ ] Run the complete offline suite.
          - [ ] Run every live gameplay check for each candidate version.
          - [ ] Mark the version supported only after all gates pass.
          EOF
          )
          number=$(gh pr list --head "$BRANCH" --state open --json number \
            --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body "$body"
          else
            gh pr create --head "$BRANCH" \
              --title "Track Minecraft release candidates" --body "$body"
          fi
